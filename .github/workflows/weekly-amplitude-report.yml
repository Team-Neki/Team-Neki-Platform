name: Amplitude Weekly Report

on:
  schedule:
    - cron: '0 1 * * 1'  # 매주 월요일 10:00 KST
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Amplitude weekly report
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.AMPLITUDE_DISCORD_WEBHOOK_URL }}
          AMPLITUDE_API_KEY: ${{ secrets.AMPLITUDE_API_KEY }}
          AMPLITUDE_SECRET_KEY: ${{ secrets.AMPLITUDE_SECRET_KEY }}
        run: python scripts/amplitude_weekly_report.py
