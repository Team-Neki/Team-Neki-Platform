name: _tmp Amplitude Event Audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: List all event types and last-week totals
        env:
          AMPLITUDE_API_KEY: ${{ secrets.AMPLITUDE_API_KEY }}
          AMPLITUDE_SECRET_KEY: ${{ secrets.AMPLITUDE_SECRET_KEY }}
        run: |
          python - <<'PYEOF'
          import datetime
          import json
          import os
          import time

          import requests

          API_KEY = os.environ["AMPLITUDE_API_KEY"]
          SECRET_KEY = os.environ["AMPLITUDE_SECRET_KEY"]
          AUTH = (API_KEY, SECRET_KEY)

          today = datetime.date.today()
          last_sunday = today - datetime.timedelta(days=today.weekday() + 1)
          last_monday = last_sunday - datetime.timedelta(days=6)
          start = last_monday.strftime("%Y%m%d")
          end = last_sunday.strftime("%Y%m%d")
          print(f"기간: {last_monday} ~ {last_sunday}")

          resp = requests.get(
              "https://amplitude.com/api/2/taxonomy/event",
              auth=AUTH,
              timeout=15,
          )
          resp.raise_for_status()
          events = resp.json()["data"]
          event_types = sorted({e["event_type"] for e in events if e.get("is_active") and not e.get("deleted")})
          print(f"조회 대상 이벤트 수: {len(event_types)}")

          results = []
          for event_type in event_types:
              params = {
                  "e": json.dumps({"event_type": event_type}),
                  "start": start,
                  "end": end,
                  "m": "totals",
              }
              r = requests.get(
                  "https://amplitude.com/api/2/events/segmentation",
                  params=params,
                  auth=AUTH,
                  timeout=15,
              )
              if r.status_code == 400:
                  results.append((event_type, 0))
                  continue
              r.raise_for_status()
              series = r.json()["data"].get("series", [[0]])
              total = sum(series[0]) if series and series[0] else 0
              results.append((event_type, total))
              time.sleep(0.2)

          print("--- 이벤트별 지난주 합계 (totals) ---")
          for event_type, total in sorted(results, key=lambda x: x[1], reverse=True):
              print(f"{event_type}: {total}")
          PYEOF
